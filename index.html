/*D27:COMP:START*/
/* Domésticas 27 — componentes. Lee las variables de tokens.css (--fondo, --vidrio, --finanzas-texto…). */

/* ---------- Acento por app ---------- */
.d-app, [data-app] {
  --acento: var(--finanzas-texto); --acento-relleno: var(--finanzas-relleno); --acento-sobre: var(--finanzas-sobre);
  --acento-hi: var(--finanzas-hi); --acento-lo: var(--finanzas-lo); --acento-brillo: var(--finanzas-brillo);
  --material: var(--vidrio);
}
[data-app="casa"] { --acento: var(--casa-texto); --acento-relleno: var(--casa-relleno); --acento-sobre: var(--casa-sobre); --acento-hi: var(--casa-hi); --acento-lo: var(--casa-lo); --acento-brillo: var(--casa-brillo); }
[data-app="noche"] { --acento: var(--noche-texto); --acento-relleno: var(--noche-relleno); --acento-sobre: var(--noche-sobre); --acento-hi: var(--noche-hi); --acento-lo: var(--noche-lo); --acento-brillo: var(--noche-brillo); }
[data-app="consulta"] { --acento: var(--consulta-texto); --acento-relleno: var(--consulta-relleno); --acento-sobre: var(--consulta-sobre); --acento-hi: var(--consulta-hi); --acento-lo: var(--consulta-lo); --acento-brillo: var(--consulta-brillo); }
[data-app="juegos"] { --acento: var(--juegos-texto); --acento-relleno: var(--juegos-relleno); --acento-sobre: var(--juegos-sobre); --acento-hi: var(--juegos-hi); --acento-lo: var(--juegos-lo); --acento-brillo: var(--juegos-brillo); }

/* Intensidad del vidrio, como el control de iOS 27: «claro» (por defecto) o «tintado». */
[data-vidrio="tintado"] { --material: var(--vidrio-tintado); }

/* ---------- Lienzo de la app ---------- */
.d-app {
  min-height: 100%;
  color: var(--tinta);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  background:
    radial-gradient(120% 55% at 0% -8%, var(--acento-brillo), transparent 62%),
    radial-gradient(80% 45% at 105% 4%, var(--acento-brillo), transparent 58%),
    var(--fondo);
}

/* ---------- Material de vidrio ---------- */
.d-vidrio {
  position: relative;
  background: var(--material, var(--vidrio));
  -webkit-backdrop-filter: blur(var(--desenfoque-vidrio)) saturate(var(--saturacion-vidrio));
  backdrop-filter: blur(var(--desenfoque-vidrio)) saturate(var(--saturacion-vidrio));
  border-radius: var(--radius-tarjeta);
  box-shadow: var(--sombra-vidrio);
}
/* Borde de luz: reflejo arriba a la izquierda y abajo a la derecha. */
.d-vidrio::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
  background: linear-gradient(155deg, var(--vidrio-brillo), transparent 34%, transparent 70%, var(--vidrio-brillo));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  opacity: .75;
}
@media (prefers-reduced-transparency: reduce) {
  .d-vidrio, .d-barra, .d-cabecera--fija, .d-boton--vidrio, .d-boton-circular { background: var(--superficie); -webkit-backdrop-filter: none; backdrop-filter: none; }
}
@media (prefers-contrast: more) {
  .d-vidrio, .d-barra { background: var(--superficie); box-shadow: 0 0 0 1px var(--tinta-2); }
}

/* ---------- Barra superior ---------- */
.d-cabecera { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-3); padding: var(--space-2) var(--space-4) var(--space-2); }
.d-cabecera h1 { margin: 0; font: 700 34px/41px var(--font-sans); letter-spacing: -0.4px; }
.d-cabecera .d-antetitulo { display: block; font: 600 13px/18px var(--font-sans); color: var(--tinta-2); }
.d-cabecera .d-acciones { display: flex; gap: var(--space-2); }
/* Al pasar contenido por debajo: barra uniforme y esmerilada (comportamiento de iOS 27). */
.d-cabecera--fija {
  position: sticky; top: 0; z-index: 5; align-items: center;
  background: linear-gradient(to bottom, var(--material, var(--vidrio)) 60%, transparent);
  -webkit-backdrop-filter: blur(var(--desenfoque-barra)) saturate(var(--saturacion-vidrio));
  backdrop-filter: blur(var(--desenfoque-barra)) saturate(var(--saturacion-vidrio));
}
.d-cabecera--fija h1 { font-size: 17px; line-height: 22px; letter-spacing: 0; font-weight: 600; }

/* ---------- Botones ---------- */
.d-boton {
  appearance: none; border: 0; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  min-height: 50px; padding: 0 var(--space-6); border-radius: var(--radius-capsula);
  font: 600 17px/22px var(--font-sans); color: var(--acento-sobre); background: var(--acento-relleno);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 8px 20px -8px var(--acento-relleno);
  transition: transform .18s cubic-bezier(.3,.7,.4,1.4);
}
.d-boton:active { transform: scale(.96); }
.d-boton--vidrio { color: var(--acento); background: var(--material, var(--vidrio)); box-shadow: var(--sombra-vidrio);
  -webkit-backdrop-filter: blur(var(--desenfoque-vidrio)) saturate(var(--saturacion-vidrio)); backdrop-filter: blur(var(--desenfoque-vidrio)) saturate(var(--saturacion-vidrio)); }
.d-boton--discreto { color: var(--acento); background: var(--relleno); box-shadow: none; }
.d-boton--ancho { width: 100%; }
.d-boton-circular {
  appearance: none; border: 0; cursor: pointer; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
  color: var(--tinta); background: var(--material, var(--vidrio)); box-shadow: var(--sombra-vidrio);
  -webkit-backdrop-filter: blur(var(--desenfoque-vidrio)) saturate(var(--saturacion-vidrio)); backdrop-filter: blur(var(--desenfoque-vidrio)) saturate(var(--saturacion-vidrio));
}
.d-boton-circular svg, .d-boton svg { width: 20px; height: 20px; }
.d-boton-circular--acento { color: var(--acento-sobre); background: var(--acento-relleno); }
.d-boton:focus-visible, .d-boton-circular:focus-visible, .d-barra button:focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }

/* ---------- Tarjeta principal ---------- */
.d-heroe {
  position: relative; overflow: hidden; border-radius: var(--radius-heroe); padding: var(--space-5);
  color: var(--acento-sobre);
  background: linear-gradient(150deg, var(--acento-hi), var(--acento-lo));
  box-shadow: var(--sombra-heroe);
}
.d-heroe::after { /* brillo de vidrio en la esquina */
  content: ""; position: absolute; width: 220px; height: 220px; right: -70px; top: -90px; border-radius: 50%;
  background: radial-gradient(circle at 35% 65%, rgba(255,255,255,.34), rgba(255,255,255,0) 62%); pointer-events: none;
}
.d-heroe .d-etiqueta { font: 600 13px/18px var(--font-sans); opacity: .92; }
.d-heroe .d-cifra-grande { display: block; margin-top: var(--space-1); font: 700 44px/48px var(--font-rounded); letter-spacing: -0.5px; font-variant-numeric: tabular-nums; }
.d-heroe .d-pie { display: flex; gap: var(--space-4); margin-top: var(--space-4); font: 400 15px/20px var(--font-sans); }
.d-heroe .d-pie b { display: block; font: 600 17px/22px var(--font-rounded); }
.d-heroe .d-barra-avance { height: 6px; margin-top: var(--space-4); border-radius: 3px; background: rgba(255,255,255,.28); overflow: hidden; }
.d-heroe .d-barra-avance i { display: block; height: 100%; border-radius: 3px; background: currentColor; }

/* ---------- Lista agrupada ---------- */
.d-seccion { margin: var(--space-6) var(--space-4) var(--space-2); display: flex; justify-content: space-between; align-items: baseline; }
.d-seccion h2 { margin: 0; font: 700 22px/28px var(--font-sans); }
.d-seccion a { color: var(--acento); font: 400 17px/22px var(--font-sans); text-decoration: none; }
.d-lista { margin: 0 var(--space-4); padding: 0; list-style: none; overflow: hidden; }
.d-fila { display: flex; align-items: center; gap: var(--space-3); min-height: 44px; padding: var(--space-3) var(--space-4); position: relative; }
.d-fila + .d-fila::before { content: ""; position: absolute; top: 0; left: 58px; right: 0; height: 0.5px; background: var(--separador); }
.d-fila .d-cuadro { flex: none; width: 30px; height: 30px; border-radius: var(--radius-s); display: grid; place-items: center; color: #fff; background: linear-gradient(150deg, var(--acento-hi), var(--acento-lo)); box-shadow: inset 0 1px 0 rgba(255,255,255,.35); }
.d-fila .d-cuadro svg { width: 18px; height: 18px; }
.d-fila .d-texto { flex: 1; min-width: 0; }
.d-fila .d-texto strong { display: block; font: 400 17px/22px var(--font-sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.d-fila .d-texto span { display: block; font: 400 15px/20px var(--font-sans); color: var(--tinta-2); }
.d-fila .d-valor { font: 600 17px/22px var(--font-rounded); font-variant-numeric: tabular-nums; white-space: nowrap; }
.d-valor--positivo { color: var(--positivo); }
.d-valor--negativo { color: var(--negativo); }

/* ---------- Control segmentado ---------- */
.d-segmentos { display: inline-flex; padding: 3px; gap: 2px; border-radius: var(--radius-capsula); background: var(--relleno); }
.d-segmentos button { appearance: none; border: 0; cursor: pointer; padding: 7px 16px; border-radius: var(--radius-capsula); background: transparent; color: var(--tinta); font: 600 13px/18px var(--font-sans); }
.d-segmentos button[aria-pressed="true"] { background: var(--superficie); box-shadow: 0 0 0 .5px var(--vidrio-borde), 0 3px 8px rgba(10,18,40,.12), inset 0 1px 0 var(--vidrio-brillo); }

/* ---------- Barra de pestañas flotante ---------- */
.d-barra-pie { position: sticky; bottom: 0; display: flex; gap: var(--space-2); align-items: center; padding: var(--space-3) var(--space-4) calc(var(--space-5) + env(safe-area-inset-bottom)); }
.d-barra {
  flex: 1; display: flex; padding: 4px; border-radius: var(--radius-capsula);
  background: var(--material, var(--vidrio)); box-shadow: var(--sombra-flotante);
  -webkit-backdrop-filter: blur(var(--desenfoque-vidrio)) saturate(var(--saturacion-vidrio)); backdrop-filter: blur(var(--desenfoque-vidrio)) saturate(var(--saturacion-vidrio));
}
.d-barra button { appearance: none; border: 0; cursor: pointer; flex: 1; display: grid; justify-items: center; gap: 1px; padding: 6px 0 5px; border-radius: var(--radius-capsula); background: transparent; color: var(--tinta); font: 600 10px/12px var(--font-sans); }
.d-barra button svg { width: 24px; height: 24px; }
.d-barra button[aria-current="page"] { color: var(--acento); background: var(--relleno); box-shadow: inset 0 1px 0 var(--vidrio-brillo); }
.d-barra-pie .d-boton-circular { width: 56px; height: 56px; box-shadow: var(--sombra-flotante); }

/* ---------- Anillo de ciclo (gas, filtro, cepillos, cápsula) ---------- */
.d-anillo { --avance: .6; --color: var(--acento); width: 64px; height: 64px; position: relative; display: grid; place-items: center; }
.d-anillo svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.d-anillo .d-pista { stroke: var(--relleno); }
.d-anillo .d-arco { stroke: var(--color); stroke-linecap: round; stroke-dasharray: calc(var(--avance) * 163.4) 163.4; }
.d-anillo b { font: 600 17px/20px var(--font-rounded); }
.d-anillo--aviso { --color: var(--aviso-relleno); }
.d-anillo--vencido { --color: var(--negativo); }

/* ---------- Chips y avisos ---------- */
.d-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: var(--radius-capsula); font: 600 12px/16px var(--font-sans); background: var(--relleno); color: var(--tinta-2); }
.d-chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.d-chip--aviso { color: var(--aviso); }
.d-chip--negativo { color: var(--negativo); }
.d-chip--positivo { color: var(--positivo); }

.d-aviso .d-punto { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--aviso-relleno); box-shadow: 0 0 0 4px color-mix(in srgb, var(--aviso-relleno) 25%, transparent); }
.d-aviso strong { display: block; font: 600 15px/20px var(--font-sans); }
.d-aviso span { display: block; font: 400 13px/18px var(--font-sans); color: var(--tinta-2); }

/* ---------- Movimiento ---------- */
@media (prefers-reduced-motion: reduce) { .d-boton { transition: none; } }

/*APP:START*/
/* Finanzas: Resumen, Cuentas, Pagos y Más. Los componentes d-* son del sistema Domésticas 27 (diseno27/ del
   repositorio casa); aquí van solo las piezas propias de esta app (c-*), las mismas de Casa más las de cuentas. */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; touch-action: pan-x pan-y; background: var(--fondo); }
body { margin: 0; min-height: 100vh; }
button, input, textarea { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
.d-app { min-height: 100vh; }
.d-cabecera { padding-top: calc(env(safe-area-inset-top) + 14px); }
.c-contenido { padding-bottom: calc(130px + env(safe-area-inset-bottom)); }

/* Barra superior compacta: aparece al desplazar, como en iOS 27 */
.c-barra-sup { position: fixed; top: 0; left: 0; right: 0; z-index: 20; padding: calc(env(safe-area-inset-top) + 11px) 16px 11px; text-align: center;
  font: 600 17px/22px var(--font-sans); background: var(--material, var(--vidrio)); box-shadow: 0 .5px 0 var(--separador);
  -webkit-backdrop-filter: blur(var(--desenfoque-barra)) saturate(var(--saturacion-vidrio)); backdrop-filter: blur(var(--desenfoque-barra)) saturate(var(--saturacion-vidrio));
  opacity: 0; pointer-events: none; transition: opacity .2s; }
.c-barra-sup.ver { opacity: 1; }

/* Barra de pestañas fija */
.c-pie { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; }
.c-desvanecer { position: fixed; left: 0; right: 0; bottom: 0; height: calc(120px + env(safe-area-inset-bottom)); z-index: 14; pointer-events: none;
  background: linear-gradient(to bottom, transparent, var(--fondo) 62%); }
.c-pie .d-barra-pie { position: static; }

/* Texto suelto */
.c-texto { margin: 12px 20px 0; font: 400 15px/21px var(--font-sans); color: var(--tinta-2); }
.c-texto b { color: var(--tinta); font-weight: 600; }
.c-texto--alerta { color: var(--negativo); }
.c-nota { margin: 8px 20px 0; font: 400 13px/18px var(--font-sans); color: var(--tinta-2); }
.c-estado { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 22px 16px 0; font: 400 13px/18px var(--font-sans); color: var(--tinta-2); text-align: center; }
.c-estado .c-punto { width: 8px; height: 8px; }
.c-acciones { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 16px 0; }
.c-acciones .d-boton { flex: 1 1 140px; padding: 0 16px; }
.d-heroe { margin: 8px 16px 0; }
.d-heroe .c-cifra-chica { font-size: 34px; line-height: 40px; }
.d-heroe .c-cifra-texto { font: 700 26px/32px var(--font-sans); letter-spacing: -0.2px; margin-top: 6px; }
.d-heroe .d-pie > div { min-width: 0; }

/* Puntos de estado */
.c-punto { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--acento); }
.c-punto--neg { background: var(--negativo); }
.c-punto--aviso { background: var(--aviso-relleno); }

<script type="module">
import * as F from './calculos.js';

const API = 'https://domesticas-api.vercel.app';
const BASE = ['cuentas.json', 'pagos.json', 'mesadas.json', 'creditos.json'];
const CL = { llave: 'fin27.llave', datos: 'fin27.datos', cola: 'fin27.cola', prefs: 'fin27.prefs', sync: 'fin27.sync', ui: 'fin27.ui', extra: 'fin27.meses' };
const $ = (id) => document.getElementById(id);

function guardarLS(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

/* ---------- Iconos ---------- */
const I = {

  moneda: '<circle cx="12" cy="12" r="8.5"/><path d="M14.5 9.2A2.8 2.8 0 0 0 12 8c-1.5 0-2.6.8-2.6 2s1.1 1.7 2.6 2 2.6.8 2.6 2-1.1 2-2.6 2a2.8 2.8 0 0 1-2.5-1.2M12 6.5V8M12 16v1.5"/>',
  escudo: '<path d="M12 3.5 5 6v5.5c0 4.2 2.9 7.6 7 9 4.1-1.4 7-4.8 7-9V6z"/><path d="M12 9v6M9 12h6"/>',
  ajustes: '<path d="M19.11 9.96L21.42 10.17L21.42 13.83L19.11 14.04A7.4 7.4 0 0 1 18.47 15.59L19.96 17.37L17.37 19.96L15.59 18.47A7.4 7.4 0 0 1 14.04 19.11L13.83 21.42L10.17 21.42L9.96 19.11A7.4 7.4 0 0 1 8.41 18.47L6.63 19.96L4.04 17.37L5.53 15.59A7.4 7.4 0 0 1 4.89 14.04L2.58 13.83L2.58 10.17L4.89 9.96A7.4 7.4 0 0 1 5.53 8.41L4.04 6.63L6.63 4.04L8.41 5.53A7.4 7.4 0 0 1 9.96 4.89L10.17 2.58L13.83 2.58L14.04 4.89A7.4 7.4 0 0 1 15.59 5.53L17.37 4.04L19.96 6.63L18.47 8.41A7.4 7.4 0 0 1 19.11 9.96Z"/><circle cx="12" cy="12" r="3"/>',

};
const ico = (n, t = 24, g = 2) => `<svg viewBox="0 0 24 24" width="${t}" height="${t}" fill="none" stroke="currentColor" stroke-width="${g}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
const ICONO_CUENTA = { fan: 'cuentas', master: 'tarjeta', liderbci: 'bolsa', copec: 'bus' };
const NOMBRE = { fan: 'FAN', master: 'Master', liderbci: 'LiderBCI', copec: 'Copec' };
const SUBTIPO = { fan: 'Cuenta corriente', master: 'Tarjeta de crédito', liderbci: 'Tarjeta de crédito', copec: 'Cuenta Copec Pay' };

/* ---------- Estado ---------- */
let llave = leerLS(CL.llave, null);
let srv = leerLS(CL.datos, {});
let cola = leerLS(CL.cola, []);
let prefs = leerLS(CL.prefs, { tema: 'auto', vidrio: 'claro' });
let sync = leerLS(CL.sync, { at: 0 });
let ui = Object.assign({ tab: 'resumen', cuenta: 'fan', hija: '' }, leerLS(CL.ui, {}));
if (ui.tab === 'mas') ui.tab = 'ajustes';
let extra = leerLS(CL.extra, []);           // meses anteriores que se pidió ver
let hoja = null;

const hoy = () => F.diaDe(new Date());
const ahoraHM = () => F.horaDe(new Date());
function vista(archivo) {
  let d = srv[archivo] && srv[archivo].contenido != null ? srv[archivo].contenido : F.plantilla(archivo);
  for (const p of cola) if (p.archivo === archivo) d = F.aplicar(archivo, d, p.cambio);
  return d;
}
// Meses que hacen falta: desde el punto de partida más antiguo hasta hoy, más los que se pidió ver
function mesesNecesarios() {
  const h = hoy(), out = [];
  let ym = F.mesInicial(vista('cuentas.json'), h);
  const desde = [ym].concat(extra).sort()[0];
  for (ym = desde; ym <= h.slice(0, 7); ym = F.sumarMesesYM(ym, 1)) out.push(ym);
  return out;
}
function archivos() { return BASE.concat(mesesNecesarios().map(F.archivoMes)).concat(cola.map((p) => p.archivo)).filter((a, i, l) => l.indexOf(a) === i); }
function datos() {
  const cuentas = vista('cuentas.json'), pagos = vista('pagos.json'), h = hoy();
  const movs = mesesNecesarios().flatMap((ym) => vista(F.archivoMes(ym)));
  const E = F.estadoCuentas(cuentas, movs, h), P = F.estadoPagos(pagos);
  const mesadas = vista('mesadas.json'), creditos = vista('creditos.json');
  return { cuentas, pagos, movs, E, P, h, mesadas, creditos, M: F.estadoMesadas(mesadas, h), CR: F.estadoCreditos(creditos, h) };
}

/* ---------- Guardado en GitHub a través de domesticas-api ---------- */
async function api(metodo, ruta, cuerpo) {
  const r = await fetch(API + ruta, {
    method: metodo, cache: 'no-store',
    headers: Object.assign({ Authorization: 'Bearer ' + llave.llave }, cuerpo ? { 'Content-Type': 'application/json' } : {}),
    body: cuerpo ? JSON.stringify(cuerpo) : undefined,
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(d.error || 'Error ' + r.status); e.status = r.status; throw e; }
  return d;
}
async function leerServidor(archivo) {
  const d = await api('GET', '/api/datos?archivo=' + encodeURIComponent(archivo));
  srv[archivo] = { contenido: d.contenido != null ? d.contenido : F.plantilla(archivo), sha: d.sha || null, leido: Date.now() };
}
function hacer(archivo, cambio, mensaje) {
  cambio.id = cambio.id || F.nuevoId('k');
  try { F.aplicar(archivo, vista(archivo), cambio); } catch (e) { avisar('No se pudo registrar', e.message, true); return false; }
  cola.push({ archivo, cambio, mensaje });
  guardarLS(CL.cola, cola);
  render();
  sincronizar(false);
  return true;
}
let enCurso = null, otraVez = false;
function sincronizar(releer) {
  if (!llave) return Promise.resolve();
  if (enCurso) { otraVez = true; return enCurso; }
  enCurso = (async () => {
    try {
      // Primero las cuentas (de ellas depende desde qué mes leer), después el resto en paralelo
      if (releer || !srv['cuentas.json'] || !srv['cuentas.json'].leido) await leerServidor('cuentas.json');
      const faltan = archivos().filter((a) => a !== 'cuentas.json' && (releer || !srv[a] || !srv[a].leido));
      await Promise.all(faltan.map(leerServidor));
      guardarLS(CL.datos, srv);
      for (const archivo of archivos()) {
        const mios = () => cola.filter((p) => p.archivo === archivo);
        for (let intento = 0; mios().length && intento < 4; intento++) {
          const lote = mios();
          if (!srv[archivo]) await leerServidor(archivo);
          let d = srv[archivo].contenido;
          lote.forEach((p) => { d = F.aplicar(archivo, d, p.cambio); });
          const quitar = () => { const ids = lote.map((p) => p.cambio.id); cola = cola.filter((p) => !ids.includes(p.cambio.id)); guardarLS(CL.cola, cola); };
          if (JSON.stringify(d) === JSON.stringify(srv[archivo].contenido)) { quitar(); continue; }
          const mensaje = lote.length === 1 ? lote[0].mensaje : lote.length + ' cambios: ' + lote.map((p) => p.mensaje).slice(0, 4).join('; ');
          try {
            const r = await api('PUT', '/api/datos?archivo=' + encodeURIComponent(archivo), { contenido: d, sha: srv[archivo].sha, mensaje: 'Finanzas · ' + mensaje });
            srv[archivo] = { contenido: d, sha: r.sha, leido: Date.now() };
            guardarLS(CL.datos, srv);
            quitar();
          } catch (e) {
            if (e.status === 409) { await leerServidor(archivo); continue; }
            throw e;
          }
        }
      }
      sync = { at: Date.now() };
    } catch (e) {
      sync = { at: sync.at || 0, error: e.status === 401 ? 'La llave de este iPhone ya no es válida. Conéctalo de nuevo en Ajustes.' : e.status ? e.message : 'Sin conexión', status: e.status || 0 };
    } finally {
      guardarLS(CL.sync, sync);
      enCurso = null;
      if (!hoja) render();
      if (otraVez) { otraVez = false; sincronizar(false); }
    }
  })();
  return enCurso;
}
function releerSiHaceFalta() {
  const viejo = archivos().some((a) => !srv[a] || Date.now() - (srv[a].leido || 0) > 30000);
  if (llave && (viejo || cola.length)) sincronizar(viejo);
}

/* ---------- Textos ---------- */
function cuando(k, h) {
  const d = Math.round((Date.UTC(+h.slice(0, 4), +h.slice(5, 7) - 1, +h.slice(8, 10)) - Date.UTC(+k.slice(0, 4), +k.slice(5, 7) - 1, +k.slice(8, 10))) / 86400000);
  return d === 0 ? 'Hoy' : d === 1 ? 'Ayer' : cap1(F.nombreDia(k)) + ' ' + F.fechaCorta(k);
}
function hace(ms) {
  const s = Math.round((Date.now() - ms) / 1000);
  if (s < 60) return 'recién';
  if (s < 3600) return 'hace ' + Math.round(s / 60) + ' min';
  if (s < 86400) return 'hace ' + Math.round(s / 3600) + ' h';
  return 'el ' + F.fechaCorta(F.diaDe(new Date(ms)));
}
const montoTxt = (m) => (F.signo(m) > 0 ? '+' : '−') + F.pesos(m.monto);

  const cuerpo = `${cuadro}<span class="d-texto"><strong>${titulo}</strong>${sub ? `<span>${sub}</span>` : ''}</span>${valor != null ? `<span class="d-valor">${valor}</span>` : ''}${extraHtml}${chev ? `<span class="c-chev">${ico('chev', 18)}</span>` : ''}`;
  return a ? `<li class="${cls}"><button class="d-fila c-fila" data-a="${a}" ${attrs}>${cuerpo}</button></li>` : `<li class="d-fila ${cls}">${cuerpo}</li>`;

function heroe(etiqueta, cifra, pie, avance, chica) {

const seccion = (t, enlace) => `<div class="d-seccion"><h2>${t}</h2>${enlace || ''}</div>`;
function filaMov(m, opts = {}) {

}
function estadoSync() {

  else if (sync.error) { punto = sync.status === 401 ? 'neg' : 'aviso'; txt = sync.error + (cola.length ? ' · ' + cola.length + ' ' + F.plural(cola.length, 'cambio', 'cambios') + ' por guardar' : ''); }

  const lista = M.aportes.filter((a) => !filtro || a.hija === filtro);
  if (!lista.length) return html + '<p class="c-texto">Sin aportes. Anota uno o trae el respaldo de Mesadas desde Ajustes.</p>' + estadoSync();
  const meses = [...new Set(lista.map((a) => a.fecha.slice(0, 7)))];
  meses.slice(0, 12).forEach((mm) => {
    const xs = lista.filter((a) => a.fecha.slice(0, 7) === mm);
    html += `<div class="d-seccion" style="margin-top:14px"><h3 class="c-subtitulo">${F.tituloMes(mm)}</h3><span class="c-seccion-nota">${F.pesos(xs.reduce((s, a) => s + a.monto, 0))}</span></div>` +
      '<ul class="d-lista d-vidrio">' + xs.map((a) => fila({ icono: 'alcancia', titulo: esc(a.asunto || 'Sin asunto'), sub: esc(a.hija) + ' · ' + cuando(a.fecha, h), valor: F.pesos(a.monto), a: 'hoja', attrs: `data-h="aporte" data-id="${esc(a.id)}"` })).join('') + '</ul>';
  });
  return html + estadoSync();
}

/* ---------- Mis créditos ---------- */
function vistaCreditos() {
  const D = datos(), CR = D.CR, T = CR.total, h = D.h;
  let html;
  if (!T.n) html = heroe('Falta pagar (consumo)', CR.lista.length ? 'Sin consumo' : 'Sin créditos', [], null, true);
  else html = heroe('Falta pagar (consumo)', F.pesos(T.saldo), [['Cuotas del mes', F.pesos(T.cuotasMes)], ['Término', T.termino ? ymTxt(T.termino) : 'Pagado']], T.activos ? T.pct : 1);
  if (T.n) html += `<p class="c-texto">${T.activos ? 'Has pagado cerca del <b>' + Math.min(99, Math.floor(T.pct * 100)) + ' %</b> de la deuda inicial de ' + (T.n === 1 ? 'este crédito' : 'estos ' + T.n + ' créditos') + ' de consumo. En cuotas faltan <b>' + F.pesos(T.porPagar) + '</b>.' : '<b>Terminaste de pagar tus créditos de consumo.</b>'}</p>`;
  html += '<div class="c-acciones"><button class="d-boton d-boton--discreto" data-a="hoja" data-h="credito">Agregar crédito</button></div>';
  if (!CR.lista.length) return html + '<p class="c-texto">Agrega tus créditos o trae el código de respaldo de Mis créditos desde Ajustes.</p>' + estadoSync();
  const grupos = [['consumo', 'Consumo'], ['hipotecario', 'Hipotecario'], ['abonos', 'Deudas con abonos']];
  grupos.forEach(([tipo, titulo]) => {
    const xs = CR.lista.filter((x) => x.c.tipo === tipo);
    if (!xs.length) return;
    html += seccion(titulo) + '<ul class="d-lista d-vidrio">' + xs.map(({ c, e }) => {
      const sub = tipo === 'abonos' ? 'Abonado ' + F.pesos(e.abonado) + ' de ' + F.pesos(e.inicial) : e.rem ? 'Cuota ' + (e.k + 1) + ' de ' + e.n + ' · ' + F.montoCredito(c.cuota, c) + (e.pagoEsteMes ? ' · pagada este mes' : '') : 'Pagado';
      return fila({ icono: tipo === 'hipotecario' ? 'casa' : 'moneda', titulo: esc(c.nombre), sub: esc(sub), valor: F.montoCredito(e.saldo, c) + `<small>${Math.min(e.rem ? 99 : 100, Math.floor(e.pct * 100))} % pagado</small>`, a: 'hoja', attrs: `data-h="credito-ver" data-id="${esc(c.id)}"`, chev: true, cls: 'c-ajustar' });
    }).join('') + '</ul>';
  });
  if (CR.lista.some((x) => x.c.tipo !== 'consumo')) html += '<p class="c-nota">El hipotecario (en UF) y las deudas con abonos no se suman al total de consumo.</p>';
  return html + estadoSync();
}

      fila({ icono: 'ciclos', titulo: 'Actualizar ahora', sub: cola.length ? cola.length + ' ' + F.plural(cola.length, 'cambio', 'cambios') + ' por guardar' : 'Trae lo último desde GitHub', a: 'actualizar', chev: true }) +

  }

    '<div class="d-vidrio c-tarjeta" style="margin-top:12px"><form data-f="importar"><label class="c-campo"><span>Respaldo copiado</span><textarea name="texto" spellcheck="false" autocapitalize="off" placeholder="Pega aquí el texto del respaldo"></textarea></label>' +
    '<p class="c-error" id="errImportar" hidden></p><div style="display:grid;margin-top:14px"><button class="d-boton d-boton--ancho">Revisar respaldo</button></div></form></div>';
  const seg = (k, op) => `<div class="d-segmentos" role="group">${op.map(([v, t]) => `<button data-a="pref" data-k="${k}" data-v="${v}" aria-pressed="${prefs[k] === v}">${t}</button>`).join('')}</div>`;

    `<li class="d-fila c-ajuste-seg"><span class="d-texto"><strong>Vidrio</strong></span>${seg('vidrio', [['claro', 'Claro'], ['tintado', 'Tintado']])}</li></ul>`;

    '<p class="c-nota">Cada cambio queda además en el historial de GitHub. Las versiones nuevas llegan solas al abrir Finanzas; si borras el icono, se borra la llave de este iPhone (los datos siguen en GitHub).</p>';
  return html + `<p class="c-estado">Finanzas ${F.VERSION} · Domésticas 27</p>`;

/* ---------- Hojas ---------- */
const chips = (nombre, ops, val) => `<div class="c-chips">${ops.map(([v, t]) => `<input type="radio" name="${nombre}" id="${nombre}-${v}" value="${v}"${String(val) === String(v) ? ' checked' : ''}><label for="${nombre}-${v}">${t}</label>`).join('')}</div>`;
const campo = (etq, html) => `<label class="c-campo"><span>${etq}</span>${html}</label>`;
const campoMonto = (nombre, etq, v) => campo(etq, `<div class="c-prefijo"><b>$</b><input type="text" name="${nombre}" inputmode="numeric" autocomplete="off" placeholder="0" value="${v != null && v !== '' ? F.miles(v).replace('−', '-') : ''}"></div>`);
const pie = (enviar, extraHtml = '') => `<p class="c-error" data-error hidden></p><div class="c-pila"><button class="d-boton">${enviar}</button>${extraHtml}<button type="button" class="d-boton d-boton--discreto" data-a="cerrar">Cancelar</button></div>`;
const borrarBtn = (que) => `<button type="button" class="d-boton c-boton-peligro" data-a="borrar" data-confirmar="Toca de nuevo para eliminar">Eliminar ${que}</button>`;
const montoDe = (v) => { const s = String(v || '').replace(/[.\s$]/g, '').replace(/^−/, '-'); return /^-?\d+$/.test(s) ? +s : null; };

function contenidoHoja() {
  const D = datos(), h = D.h, t = hoja.tipo;
  if (t === 'mov') {
    const m = hoja.id ? D.movs.find((x) => x.id === hoja.id) : null;
    if (hoja.id && !m) return '<h2>Movimiento no encontrado</h2><div class="c-pila"><button class="d-boton d-boton--discreto" data-a="cerrar">Cerrar</button></div>';
    const v = Object.assign({ cuenta: ui.tab === 'cuentas' ? ui.cuenta : 'fan', tipo: 'compra', fecha: h, hora: ahoraHM(), monto: '', comercio: '', titular: 'Titular', cuotas: 1 }, m || {}, hoja.v || {});
    const tipos = F.TIPOS_DE[v.cuenta];
    if (!tipos.includes(v.tipo)) v.tipo = tipos[0];
    const etqTipo = { compra: 'Compra', giro: 'Giro', deposito: 'Depósito', cargo: 'Cargo', abono: 'Abono', cuota: 'Cuotas por cobrar', devolucion: 'Devolución' };
    let html = `<form data-f="mov"><h2>${m ? 'Movimiento' : 'Anotar movimiento'}</h2>` + (m && m.origen === 'aviso' ? '<p>Llegó con un aviso del banco o de Copec.</p>' : '');
    if (!m) html += `<fieldset class="c-campo"><legend>Cuenta</legend>${chips('cuenta', F.ORDEN.map((c) => [c, NOMBRE[c]]), v.cuenta)}</fieldset>`;
    html += `<fieldset class="c-campo"><legend>Tipo</legend>${chips('tipo', tipos.map((x) => [x, etqTipo[x]]), v.tipo)}</fieldset>`;
    html += campoMonto('monto', 'Monto', v.monto);
    html += campo(v.cuenta === 'liderbci' ? 'Comercio' : 'Descripción o comercio', `<input type="text" name="comercio" autocomplete="off" maxlength="60" value="${esc(v.comercio)}" placeholder="${v.tipo === 'deposito' ? 'Ej. Sueldo' : 'Ej. Lider Express'}">`);
    html += `<div class="c-dos-campos">${campo('Fecha', `<input type="date" name="fecha" value="${v.fecha}" max="${h}" required>`)}${campo('Hora (opcional)', `<input type="time" name="hora" value="${v.hora || ''}">`)}</div>`;
    if (v.cuenta === 'master' && (v.tipo === 'compra' || v.tipo === 'cuota')) {
      html += `<fieldset class="c-campo"><legend>Tarjeta</legend>${chips('titular', [['Titular', 'Titular'], ['Adicional', 'Adicional']], v.titular || 'Titular')}</fieldset>`;
      html += campo(v.tipo === 'cuota' ? 'Cuotas que faltan' : 'Cuotas', `<input type="number" name="cuotas" inputmode="numeric" min="1" max="60" value="${v.cuotas || 1}">`);
    }
    if (v.cuenta === 'liderbci' && v.tipo === 'compra') html += `<p data-nota>Suma ${F.tasaPuntos(v.comercio)} % en puntos.</p>`;
    return html + pie(m ? 'Guardar cambios' : 'Anotar', m ? borrarBtn('movimiento') : '') + '</form>';
  }
  if (t === 'ajustar') {
    const id = ui.cuenta, c = F.cuenta(D.cuentas, id) || {}, e = D.E[id];
    if (id === 'master') return `<form data-f="ajustar"><h2>Ajustar Master</h2><p>Escribe el utilizado y el cupo que muestra hoy el banco. Desde hoy, las compras, cargos y abonos lo van cambiando.</p>` +
      campoMonto('monto', 'Utilizado hoy', e.utilizado != null ? e.utilizado : '') + campoMonto('cupo', 'Cupo total', c.cupo || '') + pie('Guardar') + '</form>';
    return `<form data-f="ajustar"><h2>Ajustar saldo de ${NOMBRE[id]}</h2><p>Escribe el saldo que muestra ahora ${id === 'fan' ? 'la app del banco' : 'Copec Pay'}. Desde este momento, las compras lo descuentan y los ${id === 'fan' ? 'depósitos' : 'abonos'} lo suman.</p>` +
      campoMonto('monto', 'Saldo ahora', e.definida ? e.saldo : '') + pie('Guardar saldo') + '</form>';
  }
  if (t === 'cerrar-periodo') {
    const e = D.E.liderbci;
    return `<form data-f="cerrar-periodo"><h2>Cerrar periodo de LiderBCI</h2><p>Al pagar la tarjeta: los <b>${F.miles(e.puntosPeriodo)} puntos</b> del periodo quedan guardados y el total parte de cero. Las compras desde la fecha que elijas quedan en el periodo nuevo; las anteriores siguen en el historial.</p>` +
      campo('Inicio del periodo nuevo', `<input type="date" name="desde" value="${h}" required>`) + pie('Cerrar periodo') + '</form>';
  }
  if (t === 'puntos') {
    const c = F.cuenta(D.cuentas, 'liderbci') || {}, x = hoja.id ? (c.puntos_movimientos || []).find((p) => p.id === hoja.id) : null;
    return `<form data-f="puntos"><h2>${x ? 'Movimiento de puntos' : 'Canje o ajuste de puntos'}</h2>` +
      `<fieldset class="c-campo"><legend>Tipo</legend>${chips('tipoPts', [['canje', 'Canje'], ['ajuste', 'Ajuste'], ...(x && x.tipo === 'cierre' ? [['cierre', 'Cierre']] : [])], x ? x.tipo : 'canje')}</fieldset>` +
      campo('Puntos (en un ajuste, negativo para restar)', `<input type="text" name="pts" inputmode="numeric" value="${x ? Math.abs(x.tipo === 'canje' ? -x.pts : x.pts) * (x.tipo === 'ajuste' && x.pts < 0 ? -1 : 1) : ''}" required>`) +
      campo('Fecha', `<input type="date" name="fecha" value="${x ? x.fecha : h}" max="${h}" required>`) + campo('Nota (opcional)', `<input type="text" name="nota" maxlength="120" value="${esc(x ? x.nota : '')}">`) +
      pie(x ? 'Guardar cambios' : 'Guardar', x ? borrarBtn('movimiento') : '') + '</form>';
  }
  if (t === 'pago') {
    const p = D.pagos, s = (p.secciones || []).find((y) => y.id === hoja.s) || (p.secciones || [])[0];
    const x = hoja.id ? (s.pagos || []).find((y) => y.id === hoja.id) : null;
    return `<form data-f="pago"><h2>${x ? 'Editar pago' : 'Pago nuevo'}</h2>` + campo('Pago', `<input type="text" name="texto" maxlength="80" value="${esc(x ? x.texto : '')}" placeholder="Ej. Gastos comunes" required>`) +
      `<fieldset class="c-campo"><legend>Sección</legend>${chips('seccion', (p.secciones || []).map((y) => [y.id, esc(y.nombre)]), s.id)}</fieldset>` +
      `<label class="c-interruptor"><span>Solo este mes<small>Se quita al empezar el mes siguiente</small></span><input type="checkbox" name="una_vez"${x && x.una_vez ? ' checked' : ''}></label>` +
      pie(x ? 'Guardar cambios' : 'Agregar pago', x ? borrarBtn('pago') : '') + '</form>';
  }
  if (t === 'mes-nuevo') {
    const titulo = F.tituloMes(h.slice(0, 7)), p = D.pagos;
    return `<form data-f="mes-nuevo"><h2>Empezar un mes nuevo</h2><p>${esc(p.titulo || 'El mes actual')} queda en el historial con lo que se marcó. Los pagos se desmarcan y se quitan los de solo un mes.</p>` +
      campo('Título del mes nuevo', `<input type="text" name="titulo" maxlength="40" value="${esc(p.titulo === titulo ? F.tituloMes(F.sumarMesesYM(h.slice(0, 7), 1)) : titulo)}" required>`) + pie('Empezar mes') + '</form>';
  }
  if (t === 'aporte') {
    const M = D.M, x = hoja.id ? M.aportes.find((a) => a.id === hoja.id) : null;
    const v = x || { hija: M.personas.includes(ui.hija) ? ui.hija : M.personas[0], monto: '', asunto: '', fecha: h };
    return `<form data-f="aporte"><h2>${x ? 'Aporte' : 'Anotar aporte'}</h2>` +
      `<fieldset class="c-campo"><legend>Para</legend>${chips('hija', M.personas.map((p) => [p, p]), v.hija)}</fieldset>` + campoMonto('monto', 'Monto', v.monto) +
      campo('Asunto', `<input type="text" name="asunto" maxlength="40" autocapitalize="sentences" value="${esc(v.asunto)}" placeholder="Ej. almuerzo">`) +
      `<div class="c-chips" style="margin-top:10px">${M.sugerencias.map((t2) => `<button type="button" class="c-mini c-mini--discreto" data-a="sugerencia" data-v="${esc(t2)}">${esc(t2)}</button>`).join('')}</div>` +
      campo('Fecha', `<input type="date" name="fecha" value="${v.fecha}" max="${h}" required>`) + pie(x ? 'Guardar cambios' : 'Anotar aporte', x ? borrarBtn('aporte') : '') + '</form>';
  }
  if (t === 'credito-ver') {
    const x = D.CR.lista.find((y) => y.c.id === hoja.id);
    if (!x) return '<h2>Crédito no encontrado</h2><div class="c-pila"><button class="d-boton d-boton--discreto" data-a="cerrar">Cerrar</button></div>';
    const { c, e } = x, m = (v) => F.montoCredito(v, c);
    let html = `<h2>${esc(c.nombre)}</h2>`;
    if (c.tipo === 'abonos') {
      html += `<p>Pendiente <b>${m(e.saldo)}</b> de ${m(e.inicial)} · abonado ${m(e.abonado)}.</p>` + '<ul class="d-lista d-vidrio">' +
        ((c.abonos || []).slice().reverse().slice(0, 8).map((a) => fila({ titulo: 'Abono', sub: F.esFecha(a.fecha) ? cuando(a.fecha, h) : 'sin fecha', valor: m(a.monto) })).join('') || fila({ titulo: 'Sin abonos todavía' })) + '</ul>' +
        `<div class="c-pila"><button class="d-boton" data-a="hoja" data-h="abono-credito" data-id="${esc(c.id)}">Registrar abono</button>` +
        ((c.abonos || []).length ? `<button class="d-boton d-boton--discreto" data-a="deshacer-abono" data-id="${esc(c.id)}" data-confirmar="Toca de nuevo para quitar el último abono">Quitar el último abono</button>` : '');
    } else {
      html += `<p>Saldo <b>${m(e.saldo)}</b> · ${e.k} de ${e.n} cuotas pagadas · ${Math.min(e.rem ? 99 : 100, Math.floor(e.pct * 100))} % de la deuda inicial (${m(e.inicial)}).</p>` + '<ul class="d-lista d-vidrio">' +
        fila({ titulo: 'Cuota', valor: c.moneda === 'UF' ? 'UF\u00a0' + String(c.cuota).replace('.', ',') : F.pesos(c.cuota) }) +
        fila({ titulo: 'Tasa', valor: String(c.tasa).replace('.', ',') + ' % ' + (c.tasa_tipo === 'anual' ? 'anual' : 'mensual') }) +
        (e.rem ? fila({ titulo: 'Próxima cuota', sub: 'Interés ' + m(e.interesProx) + ' · capital ' + m(e.capitalProx) }) : '') +
        fila({ titulo: 'Falta pagar en cuotas', sub: 'Interés por pagar ' + m(e.interesRest), valor: m(e.porPagar) }) +
        (e.termino ? fila({ titulo: 'Término estimado', valor: ymTxt(e.termino) }) : '') + '</ul>' +
        `<div class="c-pila">${e.rem ? `<button class="d-boton" data-a="hoja" data-h="pago-cuota" data-id="${esc(c.id)}">Registrar pago de cuota</button>` : ''}` +
        ((c.pagos || []).length ? `<button class="d-boton d-boton--discreto" data-a="deshacer-pago" data-id="${esc(c.id)}" data-confirmar="Toca de nuevo para quitar el último pago">Quitar el último pago${(c.pagos[c.pagos.length - 1] || {}).fecha && F.esFecha(c.pagos[c.pagos.length - 1].fecha) ? ' (' + F.fechaCorta(c.pagos[c.pagos.length - 1].fecha) + ')' : ''}</button>` : '');
    }
    return html + `<button class="d-boton d-boton--discreto" data-a="hoja" data-h="credito" data-id="${esc(c.id)}">Editar datos</button><button type="button" class="d-boton d-boton--discreto" data-a="cerrar">Cerrar</button></div>`;
  }
  if (t === 'pago-cuota' || t === 'abono-credito') {

    if (!x) return '';
    return `<form data-f="${t}"><h2>${t === 'pago-cuota' ? 'Pago de cuota' : 'Abono'}</h2><p>${esc(x.c.nombre)}${t === 'pago-cuota' ? ' · cuota ' + (x.e.k + 1) + ' de ' + x.e.n : ''}</p>` +
      (t === 'abono-credito' ? campoMonto('monto', 'Monto del abono', '') : '') + campo('Fecha', `<input type="date" name="fecha" value="${h}" max="${h}" required>`) + pie('Registrar') + '</form>';
  }
  if (t === 'credito') {
    const x = hoja.id ? (D.creditos.creditos || []).find((c) => c.id === hoja.id) : null;

// Los valores del formulario de movimiento, para no perderlos al cambiar de cuenta o de tipo
function valoresMov(f) {
  const v = {};
  ['cuenta', 'tipo', 'titular'].forEach((k) => { if (f[k] && f[k].value) v[k] = f[k].value; });
  ['monto', 'comercio', 'fecha', 'hora', 'cuotas'].forEach((k) => { if (f[k]) v[k] = f[k].value; });
  if (v.monto != null) v.monto = montoDe(v.monto) == null ? '' : montoDe(v.monto);
  return v;
}

      const d = await r.json().catch(() => ({}));

      Object.assign(c, { cuota: tipo === 'hipotecario' ? cuota : Math.round(cuota), plazo, pagadas_inicial: pagadas, tasa, tasa_tipo: f.tasa_tipo.value, ajuste, monto_inicial: 0, pendiente_base: 0 });
    }
    hacer('creditos.json', { tipo: 'credito', credito: c }, (previo ? 'corrige el crédito ' : 'agrega el crédito ') + nombre);
    cerrarHoja(); avisar(previo ? 'Crédito guardado' : 'Crédito agregado', nombre);
  },
  'mes-nuevo'(f) {
    const titulo = String(f.titulo.value || '').trim().slice(0, 40);
    if (!titulo) return errorHoja('Escribe el título del mes nuevo.');
    hacer('pagos.json', { tipo: 'mesNuevo', titulo, fecha: hoy() }, 'empieza ' + titulo);
    cerrarHoja(); avisar('Comenzó ' + titulo);
  },
};

document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-a]');
  if (!el) return;
  if (el.tagName === 'A') ev.preventDefault();
  if (el.dataset.confirmar && !el.dataset.armado) {
    el.dataset.armado = '1'; el.dataset.texto = el.innerHTML;
    const strong = el.querySelector('strong');
    if (strong) strong.textContent = el.dataset.confirmar; else el.textContent = el.dataset.confirmar;
    setTimeout(() => { if (el.isConnected && el.dataset.armado) { el.innerHTML = el.dataset.texto; delete el.dataset.armado; } }, 4000);
    return;
  }
  const fn = ACCIONES[el.dataset.a];
  if (fn) fn(el, ev);
});
document.addEventListener('submit', (ev) => {
  const f = ev.target.closest('form[data-f]');
  if (!f) return;
  ev.preventDefault();
  const fn = FORMULARIOS[f.dataset.f];
  if (fn) fn(f);
});
// En la hoja de movimiento, cambiar de cuenta o de tipo cambia los campos (sin perder lo escrito)
function alCambiar(ev) {
  const fc = ev.target.closest('#hoja form[data-f="credito"]');
  if (fc && ev.target.name === 'tipo' && ev.type === 'change') {
    hoja.v = {}; ['nombre', 'cuota', 'plazo', 'pagadas_inicial', 'tasa', 'ajuste', 'monto_inicial', 'pendiente_base'].forEach((k) => { if (fc[k]) hoja.v[k] = fc[k].value; });
    hoja.v.tipo = ev.target.value; if (fc.tasa_tipo) hoja.v.tasa_tipo = fc.tasa_tipo.value;
    repintarHoja(); return;
  }
  const f = ev.target.closest('#hoja form[data-f="mov"]');
  if (!f || !hoja) return;
  if (['cuenta', 'tipo'].includes(ev.target.name) && ev.type === 'change') { hoja.v = valoresMov(f); repintarHoja(); return; }
  const nota = f.querySelector('[data-nota]');
  if (nota && ev.target.name === 'comercio') nota.textContent = 'Suma ' + F.tasaPuntos(ev.target.value) + ' % en puntos.';
}
document.addEventListener('change', alCambiar);
document.addEventListener('input', alCambiar);
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') cerrarHoja(); });

/* ---------- Pintar ---------- */
const PESTANAS = [['resumen', 'resumen', 'Resumen'], ['cuentas', 'cuentas', 'Cuentas'], ['pagos', 'pagos', 'Pagos'], ['ajustes', 'ajustes', 'Ajustes']];
const VISTAS = ['resumen', 'cuentas', 'pagos', 'ajustes', 'mesadas', 'creditos'];
function cabecera() {
  const h = hoy();
  const t = { resumen: [F.tituloMes(h.slice(0, 7)), 'Finanzas'], cuentas: ['FAN, Master, LiderBCI y Copec', 'Cuentas'], pagos: ['Pagos del mes', 'Pagos'], ajustes: ['Finanzas ' + F.VERSION, 'Ajustes'],
    mesadas: ['<button class="c-volver" data-a="tab" data-t="resumen">' + ico('volver', 16) + 'Resumen</button>', 'Mesadas'], creditos: ['<button class="c-volver" data-a="tab" data-t="resumen">' + ico('volver', 16) + 'Resumen</button>', 'Mis créditos'] }[ui.tab];
  return `<div><span class="d-antetitulo">${t[0]}</span><h1>${t[1]}</h1></div><div class="d-acciones"><button class="d-boton-circular" data-a="ayuda" aria-label="Ayuda">${ico('ayuda', 20)}</button></div>`;
}
function render() {
  if (!VISTAS.includes(ui.tab)) ui.tab = 'resumen';
  $('cabecera').innerHTML = cabecera();
  $('vista').innerHTML = { resumen: vistaResumen, cuentas: vistaCuentas, pagos: vistaPagos, ajustes: vistaAjustes, mesadas: vistaMesadas, creditos: vistaCreditos }[ui.tab]();
  $('barraSup').textContent = { resumen: 'Finanzas', cuentas: NOMBRE[ui.cuenta], pagos: 'Pagos del mes', ajustes: 'Ajustes', mesadas: 'Mesadas', creditos: 'Mis créditos' }[ui.tab];
  const activa = ui.tab === 'mesadas' || ui.tab === 'creditos' ? 'resumen' : ui.tab;
  $('pestanas').innerHTML = PESTANAS.map(([id, ic, t]) => `<button data-a="tab" data-t="${id}"${activa === id ? ' aria-current="page"' : ''}>${ico(ic)}${t}</button>`).join('');
}
function aplicarPrefs() {
  const oscuro = prefs.tema === 'oscuro' || (prefs.tema !== 'claro' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', oscuro ? 'dark' : 'light');
  if (prefs.vidrio === 'tintado') document.body.setAttribute('data-vidrio', 'tintado'); else document.body.removeAttribute('data-vidrio');
}

// Actualización sin reinstalar (igual que Casa): una recarga por versión nueva
async function buscarVersionNueva() {
  try {
    const t = await (await fetch('calculos.js?v=' + Date.now(), { cache: 'no-store' })).text();
    const m = /VERSION = '([^']+)'/.exec(t);
    if (!m || m[1] === F.VERSION || sessionStorage.getItem('fin27.recargada') === m[1]) return;
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if (reg) await reg.update().catch(() => {});
    if (hoja || (document.activeElement && document.activeElement.matches('input, textarea'))) return;
    sessionStorage.setItem('fin27.recargada', m[1]);
    location.reload();
  } catch (e) {}
}

/* ---------- Arranque ---------- */
document.querySelector('[data-a="anotar"]').innerHTML = ico('mas', 22, 2.4);
aplicarPrefs();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', aplicarPrefs);
render();
releerSiHaceFalta();
buscarVersionNueva();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { if (!hoja) render(); releerSiHaceFalta(); buscarVersionNueva(); } });
window.addEventListener('online', () => sincronizar(false));
setInterval(() => { if (document.visibilityState === 'visible' && !hoja) render(); }, 60000);
let verBarra = false;
window.addEventListener('scroll', () => { const v = window.scrollY > 46; if (v !== verBarra) { $('barraSup').classList.toggle('ver', v); verBarra = v; } }, { passive: true });
['gesturestart', 'gesturechange', 'gestureend'].forEach((t) => document.addEventListener(t, (e) => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', (e) => { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
